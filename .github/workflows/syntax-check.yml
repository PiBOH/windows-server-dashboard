# ---------------------------------------------------------------------------
#  Every push is parsed by the real PowerShell parser on a Windows runner.
#  A syntax error would make the dashboard exit before writing a single line
#  of log, so this check is the cheapest insurance there is.
#
#  The parse runs under Windows PowerShell 5.1 (shell: powershell) because
#  that is the engine the scheduled task really uses: pwsh 7 accepts a few
#  constructs that 5.1 refuses, and a file that only parses on 7 would boot
#  straight into a dead service.
# ---------------------------------------------------------------------------
name: Syntax check

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    name: Parse every script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the PowerShell files (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Path scripts -Filter *.ps1 -File) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
                $f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) {
              $bad++
              Write-Host "::error file=$($f.Name)::$($errors.Count) syntax error(s)"
              foreach ($e in $errors) {
                Write-Host ("  line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
              }
            } else {
              Write-Host "OK  $($f.Name)"
            }
          }
          if ($bad) { exit 1 }

      - name: Check the language files (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ref = $null; $bad = 0
          foreach ($f in Get-ChildItem -Path lang -Filter *.xml -File) {
            try { [xml]$x = Get-Content $f.FullName -Raw -Encoding UTF8 }
            catch { Write-Host "::error file=$($f.Name)::not valid XML"; $bad++; continue }
            $keys = @($x.language.string.key)
            if (-not $ref) { $ref = $keys }
            $missing = @($ref | Where-Object { $_ -notin $keys })
            if ($missing.Count) {
              Write-Host "::warning file=$($f.Name)::missing keys: $($missing -join ', ')"
            }
            Write-Host ("{0,-14} {1,3} keys" -f $f.Name, $keys.Count)
          }
          if ($bad) { exit 1 }

  bitness:
    # The dashboard has to work on 32-bit Windows too, and it is the SAME
    # script there: what changes is the engine that runs it. A 64-bit runner
    # still ships the 32-bit Windows PowerShell (%WINDIR%\SysWOW64\...), so
    # starting the dashboard with that executable exercises the whole path on
    # a 32-bit engine: the HTTP listener, CIM/WMI, the Core Temp shared memory
    # read, the temperature chain, the JSON.
    name: Run the dashboard on the 32-bit engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start it with %WINDIR%\SysWOW64 Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ps32 = Join-Path $env:WINDIR 'SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path $ps32)) {
            Write-Host '::error ::this runner has no 32-bit Windows PowerShell'
            exit 1
          }
          # No update check in a test: it would talk to GitHub and could even
          # overwrite the checkout. settings.txt is not part of the package.
          Set-Content -Path settings.txt -Value 'auto_update = no' -Encoding UTF8
          $out = Join-Path $env:RUNNER_TEMP 'dash32.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'dash32.err.log'
          $proc = Start-Process -FilePath $ps32 -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err `
              -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass',
                              (Join-Path $PWD 'scripts\ServerDashboard.ps1'),
                              '-Port','8123','-IntervalSeconds','1')
          $failed = $false
          try {
            $health = $null
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = (Invoke-WebRequest 'http://localhost:8123/api/health' `
                           -UseBasicParsing -TimeoutSec 3).Content
                break
              } catch { }
            }
            if (-not $health) {
              Write-Host '::error ::the dashboard never answered under the 32-bit engine'
              if (Test-Path $out) { Get-Content $out -Tail 40 }
              if (Test-Path $err) { Get-Content $err -Tail 20 }
              exit 1
            }
            Write-Host "health: $health"
            if ($health -notmatch '32-bit engine') {
              Write-Host '::error ::/api/health does not report the 32-bit engine'
              $failed = $true
            }
            # /api/stats carries the CPU section only after the first sampling
            # cycle has finished, and on a busy runner that cycle can take
            # longer than the health answer: asking once made this job fail
            # with "carries no CPU section" while the same commit passed on a
            # re-run. Wait for it, with the same assertions afterwards.
            $cpu = $null
            foreach ($i in 1..30) {
              try {
                $stats = Invoke-RestMethod 'http://localhost:8123/api/stats' -TimeoutSec 15
                if ($stats.Current.Cpu) { $cpu = $stats.Current.Cpu; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $cpu) { Write-Host '::error ::/api/stats carries no CPU section'; $failed = $true }
            else {
              Write-Host ("CPU: load {0} %, {1} core(s), temperature source '{2}', {3} sensor(s)" -f
                          $cpu.TotalLoad, $cpu.PerCore.Count, $cpu.TempSource, $cpu.Temperatures.Count)
              # the reading it may be empty (no sensor on a cloud VM), the FIELD
              # must be there: the page decides between a number and its own
              # wording, and it needs to know that the chain was tried
              if ($cpu.PSObject.Properties.Name -notcontains 'TempSource') {
                Write-Host '::error ::/api/stats no longer carries Cpu.TempSource'; $failed = $true
              }
            }
            $page = (Invoke-WebRequest 'http://localhost:8123/' -UseBasicParsing -TimeoutSec 15).Content
            if ($page -notmatch 'id="cputemp"') {
              Write-Host '::error ::the page does not carry the temperature row'; $failed = $true
            }
            $log = Get-ChildItem -Path logs -Filter 'ServerDashboard-*.log' -File -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $log) { Write-Host '::error ::no log file was written'; $failed = $true }
            else {
              $txt = Get-Content $log.FullName -Raw
              if ($txt -notmatch '32-bit engine on') {
                Write-Host '::error ::the log does not report the 32-bit engine'; $failed = $true
              }
              if ($txt -notmatch 'CPU temperature') {
                Write-Host '::error ::the log says nothing about the temperature chain'
                $failed = $true
              }
            }
            if ($failed) { exit 1 }
            Write-Host 'the dashboard ran on the 32-bit engine'
          } finally {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch { }
            try { Remove-Item -LiteralPath settings.txt -Force -ErrorAction SilentlyContinue } catch { }
          }
